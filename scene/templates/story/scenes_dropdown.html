{% load i18n %}

{% if scenes.count > 0 %}
    <el-dropdown class="inline-block" x-data="{ open: false }" @open="open = true" @close="open = false" :class="{ 'z-50': open }">
        <button class="cursor-pointer inline-flex items-center gap-1.5 rounded-md bg-base-100 dark:bg-base-800 border border-base-200 dark:border-base-700 px-2.5 py-1.5 text-xs font-semibold text-font-secondary-light dark:text-font-secondary-dark shadow-sm hover:bg-base-200 dark:hover:bg-base-700 transition-colors">
            <span class="material-symbols-outlined text-[16px]">movie</span>
            {{ scenes.count }}
        </button>

        <el-menu anchor="bottom start" popover class="w-56 origin-top-left rounded-lg bg-white dark:bg-base-800 shadow-xl border border-base-200 dark:border-base-700 p-1.5 transition transition-discrete data-closed:scale-95 data-closed:opacity-0">
            <div class="flex flex-col gap-0.5">
                {% for scene in scenes %}
                    <a href="{% url 'admin:scene_scene_changelist' %}?id__exact={{ scene.id }}" class="flex items-center justify-between px-3 py-1.5 text-[11px] hover:bg-base-100 dark:hover:bg-white/[.05] transition-colors rounded-md text-font-secondary-light dark:text-white hover:text-primary-600 dark:hover:text-primary-400 group/item">
                        <span class="truncate grow min-w-0" title="{{ scene.name }}">{{ scene.name|default:scene.id }}</span>
                        <span class="font-bold text-font-important-light dark:text-font-important-dark bg-base-100 dark:bg-base-800 px-1.5 py-0.5 rounded text-[10px] ml-2 shrink-0">#{{ scene.order|default:forloop.counter }}</span>
                    </a>
                {% endfor %}
            </div>
        </el-menu>
    </el-dropdown>
{% else %}
    <div class="inline-flex items-center gap-1 rounded-md border border-base-200 dark:border-base-800 px-1.5 py-0.5 text-[9px] font-bold text-font-tertiary-light dark:text-font-tertiary-dark opacity-50 cursor-default bg-transparent">
        <span class="material-symbols-outlined text-[14px]">movie</span>
        {% trans "No scenes" %}
    </div>
{% endif %}
